<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ZiJun Central Hub redirect gateway.">
  <title>ZiJun Central Hub - Redirecting</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2307111f'/%3E%3Cpath d='M33 38 21 50l12 12M67 38l12 12-12 12M57 27 43 73' fill='none' stroke='%2367e8f9' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --text: #f8fafc;
      --soft: #dbeafe;
      --muted: #a7b4c8;
      --cyan: #67e8f9;
      --violet: #c4b5fd;
      --gold: #fcd34d;
      --glass: rgba(7, 12, 24, 0.34);
      --glass-strong: rgba(7, 12, 24, 0.48);
      --line: rgba(255, 255, 255, 0.22);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      overflow: hidden;
      background: #050813;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      filter: saturate(1.18) contrast(1.04) brightness(1.08);
      z-index: -3;
    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(2, 6, 23, 0.72) 0%, rgba(2, 6, 23, 0.36) 42%, rgba(2, 6, 23, 0.08) 100%),
        linear-gradient(0deg, rgba(2, 6, 23, 0.62) 0%, rgba(2, 6, 23, 0.08) 38%, rgba(2, 6, 23, 0.16) 100%);
    }

    .scanline {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      pointer-events: none;
      background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 7px);
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items: end;
      gap: clamp(20px, 4vw, 56px);
      padding: clamp(22px, 5vw, 72px);
    }

    .hero {
      max-width: 760px;
      padding-bottom: clamp(12px, 3vw, 34px);
      animation: rise 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid rgba(103, 232, 249, 0.38);
      border-radius: 999px;
      background: rgba(8, 47, 73, 0.32);
      color: #cffafe;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan);
    }

    h1 {
      margin: 20px 0 18px;
      max-width: 10ch;
      font-size: clamp(3.1rem, 9vw, 7.6rem);
      line-height: 0.88;
      letter-spacing: 0;
      text-shadow: 0 5px 28px rgba(0, 0, 0, 0.55);
    }

    .lead {
      max-width: 52ch;
      margin: 0;
      color: var(--soft);
      font-size: clamp(1rem, 1.7vw, 1.2rem);
      line-height: 1.7;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.62);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }

    .chips li {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #edf7ff;
      background: rgba(0, 0, 0, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(7px);
      font-size: 0.92rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .button,
    .ghost {
      min-height: 50px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 0;
      font: inherit;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button {
      color: #06101c;
      background: linear-gradient(135deg, var(--cyan), var(--violet) 58%, var(--gold));
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
    }

    .ghost {
      color: var(--text);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    .button:hover,
    .ghost:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.32);
    }

    .button:focus-visible,
    .ghost:focus-visible {
      outline: 3px solid rgba(103, 232, 249, 0.82);
      outline-offset: 4px;
    }

    .dock {
      width: min(100%, 320px);
      justify-self: end;
      align-self: center;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, var(--glass), var(--glass-strong));
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.36);
      padding: 22px;
      animation: rise 700ms 120ms cubic-bezier(.2,.8,.2,1) both;
    }

    .ring {
      position: relative;
      width: 168px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 4px auto 18px;
    }

    .ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .track,
    .progress {
      fill: none;
      stroke-width: 8;
    }

    .track { stroke: rgba(255, 255, 255, 0.2); }

    .progress {
      stroke: url(#timerGradient);
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(103, 232, 249, 0.45));
      transition: stroke-dashoffset 280ms linear;
    }

    .number {
      width: 102px;
      height: 102px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 3.3rem;
      font-weight: 900;
      line-height: 1;
    }

    .dock p {
      margin: 0;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }

    .dock strong {
      display: block;
      margin-top: 4px;
      color: var(--text);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      body { overflow: auto; }

      .page {
        min-height: 100svh;
        grid-template-columns: 1fr;
        align-items: end;
        padding: 22px;
      }

      .dock {
        grid-row: 1;
        justify-self: start;
        align-self: start;
        width: min(100%, 270px);
      }

      .ring { width: 128px; }
      .number { width: 78px; height: 78px; font-size: 2.55rem; }
      h1 { max-width: 9ch; }
    }

    @media (max-width: 480px) {
      .page { gap: 20px; padding: 16px; }
      .actions { align-items: stretch; }
      .button, .ghost { width: 100%; }
      .chips li { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="https://github.com/ZiJun198/zijun198.github.io/raw/refs/heads/main/202605171619.mp4" type="video/mp4">
  </video>
  <div class="shade" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <main class="page">
    <section class="hero" aria-labelledby="title">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Redirecting now</div>
      <h1 id="title">ZiJun Central Hub</h1>
      <p class="lead">Your gateway to design tools, AI assistants, creative experiments, and interactive projects. The hub will open automatically in a moment.</p>

      <ul class="chips" aria-label="Hub highlights">
        <li>
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v10l-7 4-7-4V7l7-4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8.5 10l7 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Design tools
        </li>
        <li>
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          AI assistants
        </li>
        <li>
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Interactive projects
        </li>
      </ul>

      <div class="actions">
        <a class="button" id="enter-link" href="https://pacguy-mtk.github.io/">
          Enter Hub
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="ghost" id="pause-button" type="button" aria-pressed="false">Pause timer</button>
      </div>
    </section>

    <aside class="dock" aria-label="Automatic redirect countdown">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="timerGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#67e8f9"/>
              <stop offset="56%" stop-color="#c4b5fd"/>
              <stop offset="100%" stop-color="#fcd34d"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="50"></circle>
          <circle class="progress" id="progress" cx="60" cy="60" r="50"></circle>
        </svg>
        <span class="number" id="seconds">10</span>
      </div>
      <p aria-live="polite">Auto-redirect in <span id="countdown-text">10 seconds</span><strong>pacguy-mtk.github.io</strong></p>
    </aside>
  </main>

  <script>
    const HUB_URL = 'https://pacguy-mtk.github.io/';
    const TOTAL_SECONDS = 10;

    const enterLink = document.getElementById('enter-link');
    const pauseButton = document.getElementById('pause-button');
    const secondsEl = document.getElementById('seconds');
    const countdownText = document.getElementById('countdown-text');
    const progress = document.getElementById('progress');
    const circumference = 2 * Math.PI * 50;

    let remaining = TOTAL_SECONDS;
    let paused = false;
    let timerId;

    progress.style.strokeDasharray = circumference;

    function secondsLabel(value) {
      return `${value} second${value === 1 ? '' : 's'}`;
    }

    function render() {
      const safeRemaining = Math.max(remaining, 0);
      const ratio = (TOTAL_SECONDS - safeRemaining) / TOTAL_SECONDS;
      secondsEl.textContent = safeRemaining;
      countdownText.textContent = secondsLabel(safeRemaining);
      progress.style.strokeDashoffset = ratio * circumference;
      document.title = safeRemaining > 0 ? `ZiJun Central Hub - ${safeRemaining}s` : 'Opening ZiJun Central Hub';
    }

    function goToHub() {
      window.location.assign(HUB_URL);
    }

    function tick() {
      if (paused) return;
      remaining -= 1;
      render();

      if (remaining <= 0) {
        window.clearInterval(timerId);
        goToHub();
      }
    }

    enterLink.addEventListener('click', (event) => {
      event.preventDefault();
      window.clearInterval(timerId);
      goToHub();
    });

    pauseButton.addEventListener('click', () => {
      paused = !paused;
      pauseButton.textContent = paused ? 'Resume timer' : 'Pause timer';
      pauseButton.setAttribute('aria-pressed', String(paused));
    });

    render();
    timerId = window.setInterval(tick, 1000);
  </script>
</body>
</html>
