<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="ZiJun Hub. Choose the 3D room or the classic site; the room opens automatically in 10 seconds.">
  <title>ZiJun Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2307111f'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial' font-weight='900' font-size='46' fill='%2342e8d4'%3EZJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;650;900&display=swap" rel="stylesheet">
  <noscript><meta http-equiv="refresh" content="10;url=https://pacguy-mtk.github.io/?mode=classic"></noscript>
  <style>
    :root { color-scheme: dark; --bg: #07111f; --text: #f4f7ff; --muted: #aab5ce; --line: rgba(255,255,255,.16); --cyan: #42e8d4; --blue: #7aa7ff; --violet: #8b5cf6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; color: var(--text); background: var(--bg); overflow: hidden; }

    /* background: plain video + one static gradient. No blur, no CSS filters, so nothing is re-drawn per frame. */
    .bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; z-index: -2; }
    .shade { position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, rgba(7,17,31,.62), rgba(7,17,31,.9) 78%), linear-gradient(0deg, rgba(7,17,31,.9), transparent 42%); }

    .mark { position: fixed; top: 16px; left: 16px; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #07111f; text-decoration: none; background: linear-gradient(135deg, var(--cyan), var(--violet)); }

    main { width: min(380px, calc(100% - 40px)); display: grid; gap: 12px; text-align: center; animation: fade .6s ease both; }
    h1 { margin: 0; font-size: clamp(2.6rem, 10vw, 3.8rem); line-height: 1; font-weight: 900; letter-spacing: -.02em; }
    h1 span { background: linear-gradient(135deg, var(--cyan), var(--blue) 55%, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: .95rem; }

    .opt { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 0 20px; border-radius: 18px; color: var(--text); text-decoration: none; background: rgba(7,17,31,.72); border: 1px solid var(--line); transition: transform .15s ease, border-color .15s ease; }
    .opt:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.34); }
    .opt:focus-visible, .pause:focus-visible { outline: 3px solid rgba(66,232,212,.85); outline-offset: 3px; }
    .opt.main { border-color: rgba(66,232,212,.6); }
    .fill { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; background: linear-gradient(90deg, rgba(66,232,212,.5), rgba(122,167,255,.5)); will-change: transform; pointer-events: none; }
    .opt > span { position: relative; display: inline-flex; align-items: center; gap: 12px; font-weight: 650; font-size: 1.05rem; }
    .opt svg { flex: none; }
    .opt em { position: relative; font-style: normal; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .opt.main em { color: var(--text); font-weight: 650; }

    .pause { justify-self: center; margin-top: 4px; padding: 6px 10px; background: none; border: 0; color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .pause:hover { color: var(--text); }
    .credit { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; font-size: .72rem; color: rgba(170,181,206,.6); pointer-events: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body>
  <video class="bg" id="bg" autoplay muted loop playsinline preload="auto" poster="assets/bg-poster.jpg" aria-hidden="true"><source src="assets/bg.mp4" type="video/mp4"></video>
  <div class="shade" aria-hidden="true"></div>
  <a class="mark" href="https://pacguy-mtk.github.io/" aria-label="ZiJun Hub">ZJ</a>

  <main id="box">
    <h1>ZiJun <span>Hub</span></h1>
    <p class="sub">Design / AI / Tools</p>

    <a class="opt main" id="a-room" href="https://pacguy-mtk.github.io/room.html?mode=room">
      <i class="fill" id="fill"></i>
      <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#42e8d4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>3D Room</span>
      <em id="e-room">10s</em>
    </a>
    <a class="opt" id="a-classic" href="https://pacguy-mtk.github.io/?mode=classic">
      <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7aa7ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 9v11"/></svg>Classic site</span>
      <em id="e-classic">lighter</em>
    </a>
    <button class="pause" id="pause" type="button" aria-pressed="false">Pause</button>
  </main>
  <p class="credit">this is ZiJun system, designed by ZiJun, built by AI.</p>
  <div class="sr" id="live" aria-live="polite"></div>

  <script>
    (function () {
      var BASE = 'https://pacguy-mtk.github.io/';
      var URLS = { room: BASE + 'room.html?mode=room', classic: BASE + '?mode=classic' };
      var TOTAL = 10000, KEY = 'zj_gate';
      var $ = function (id) { return document.getElementById(id); };

      /* can this visitor run the 3D room? (same checks as the main site) */
      function canRoom() {
        try { var c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) return false; } catch (e) { return false; }
        if (navigator.connection && navigator.connection.saveData) return false;
        if (/bot|crawl|spider|lighthouse/i.test(navigator.userAgent)) return false;
        return true;
      }
      var roomOk = canRoom(), q = new URLSearchParams(location.search), saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      var target = URLS[q.get('to')] ? q.get('to') : (URLS[saved] ? saved : 'room');
      if (!roomOk) target = 'classic';
      var other = target === 'room' ? 'classic' : 'room';

      /* the target gets the highlighted, filling button on top; the other sits below */
      var mainEl = $('a-' + target), subEl = $('a-' + other), fill = $('fill'), sec = $('e-' + target);
      mainEl.classList.add('main'); subEl.classList.remove('main');
      mainEl.style.order = 1; subEl.style.order = 2; $('pause').style.order = 3;
      mainEl.insertBefore(fill, mainEl.firstChild);
      $('e-' + other).textContent = (other === 'classic') ? 'lighter' : (roomOk ? 'cozy desk' : 'may not run here');
      $('box').style.gridAutoFlow = 'row';

      function href(k) { return URLS[k] + location.hash; }
      ['room', 'classic'].forEach(function (k) { $('a-' + k).href = href(k); });
      function go(k) { try { localStorage.setItem(KEY, k); } catch (e) {} location.assign(href(k)); }
      ['room', 'classic'].forEach(function (k) { $('a-' + k).addEventListener('click', function (e) { e.preventDefault(); go(k); }); });

      /* the countdown IS the fill animation: it runs on the compositor (transform only), so it stays smooth */
      var cameBack = (function () { var n = performance.getEntriesByType && performance.getEntriesByType('navigation')[0]; return !!(n && n.type === 'back_forward'); })();
      var anim = null, paused = false, shown = -1, fallback = 0;
      if (fill.animate) {
        anim = fill.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: TOTAL, easing: 'linear', fill: 'forwards' });
        anim.onfinish = function () { go(target); };
      } else { fallback = setTimeout(function () { go(target); }, TOTAL); }

      function label() {
        if (paused) { sec.textContent = 'paused'; document.title = 'ZiJun Hub'; return; }
        var s = anim ? Math.max(0, Math.ceil((TOTAL - (anim.currentTime || 0)) / 1000)) : 10;
        if (s !== shown) {
          shown = s; sec.textContent = s + 's'; document.title = 'ZiJun Hub | ' + s + 's';
          if (s === 10 || s === 5) $('live').textContent = 'Opening ' + (target === 'room' ? '3D Room' : 'Classic site') + ' in ' + s + ' seconds. Press Escape to pause.';
        }
      }
      function setPaused(p) {
        paused = p;
        if (anim) { p ? anim.pause() : anim.play(); } else if (p) { clearTimeout(fallback); } else { fallback = setTimeout(function () { go(target); }, TOTAL); }
        $('pause').textContent = p ? 'Resume' : 'Pause'; $('pause').setAttribute('aria-pressed', String(p));
        shown = -1; label();
      }
      $('pause').addEventListener('click', function () { setPaused(!paused); });
      setInterval(label, 200);
      if (cameBack) setPaused(true); else label();

      document.addEventListener('keydown', function (e) {
        var k = e.key.toLowerCase(), tag = (document.activeElement || {}).tagName || '';
        if (e.key === 'Escape') setPaused(!paused);
        else if (k === 'r') go('room');
        else if (k === 'c') go('classic');
        else if (e.key === 'Enter' && tag !== 'A' && tag !== 'BUTTON') go(target);
      });

      /* video: respect reduced motion / data saver, rest while the tab is hidden */
      var video = $('bg'), calm = matchMedia('(prefers-reduced-motion: reduce)').matches || (navigator.connection && navigator.connection.saveData);
      if (calm) { video.removeAttribute('autoplay'); video.pause(); }
      document.addEventListener('visibilitychange', function () { if (!calm) { document.hidden ? video.pause() : video.play().catch(function () {}); } });
    })();
  </script>
</body>
</html>
